<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>My To-Do List</h1>

    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn">Add</button>
    </div>

    <p id="errorMsg" class="error hidden">Task can't be empty!</p>

    <ul id="taskList"></ul>

    <p id="taskCount">0 tasks left</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
